[package]
name = "benchmark-api-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
bytes = "=1.10.1"
deadpool-postgres = "=0.14.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.17", features = ["tokio"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-postgres = { version = "=0.7.15", features = ["with-uuid-1"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[profile.release]
opt-level = 3
